<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VoxelWorld</title>
<style>
  :root { color-scheme: light; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#cfd3ec; }
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }

  /* ---- boot veil ---- */
  #boot {
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(100% 80% at 50% 35%, #ddd9ea 0%, #c9cce2 64%, #bec4df 100%);
    transition:opacity .7s ease .1s, visibility .7s;
  }
  #boot.gone { opacity:0; visibility:hidden; }
  #boot h1 {
    font-size:13px; font-weight:650; letter-spacing:.28em; text-transform:uppercase;
    color:#655d78; text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  #boot .sub { display:none; font-size:11px; color:#756a89; }
  #boot .sub.error { display:block; }
  #bar { width:min(180px, 42vw); height:3px; border-radius:99px; background:rgba(255,255,255,.42); overflow:hidden; }
  #bar i { display:block; height:100%; width:0%; border-radius:99px;
           background:linear-gradient(90deg,#c998b2,#9182b5); transition:width .25s ease; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">
    <h1>VoxelWorld</h1>
    <div id="bar"><i></i></div>
    <div class="sub" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
