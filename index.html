<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VoxelWorld</title>
<style>
  :root {
    --gold:#c9ad73; --gold-bright:#e6cf95;
    --ink:#e8dcc1; --ink-soft:rgba(232,220,193,.72); --ink-faint:rgba(232,220,193,.40);
    --line:rgba(201,173,115,.3);
    --fd:Inter, ui-sans-serif, system-ui, sans-serif;
    --fb:Inter, ui-sans-serif, system-ui, sans-serif;
    color-scheme: dark;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#07070a; }
  body { font-family: var(--fd); -webkit-font-smoothing:antialiased; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }

  /* ---- boot veil ---- */
  #boot {
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(100% 80% at 50% 35%, #12100f 0%, #0a0909 64%, #07070a 100%);
    transition:opacity .7s ease .1s, visibility .7s;
  }
  #boot.gone { opacity:0; visibility:hidden; }
  #boot h1 {
    font-size:13px; font-weight:700; letter-spacing:.28em; text-transform:uppercase;
    color:var(--gold); text-shadow:0 0 18px rgba(201,173,115,.35);
  }
  #boot .sub { display:none; font-size:11px; color:var(--ink-soft); }
  #boot .sub.error { display:block; }
  #bar { width:min(180px, 42vw); height:2px; border-radius:99px; background:rgba(201,173,115,.14); overflow:hidden; }
  #bar i { display:block; height:100%; width:0%; border-radius:99px;
           background:linear-gradient(90deg,var(--gold),var(--gold-bright)); transition:width .25s ease; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">
    <h1>VoxelWorld</h1>
    <div id="bar"><i></i></div>
    <div class="sub" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
